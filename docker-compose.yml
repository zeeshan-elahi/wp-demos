name: wp-demos

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_core:/var/www/html
      - ./themes/gutenberg-blocks-demo:/var/www/html/wp-content/themes/gutenberg-blocks-demo
      - ./plugins/demo-blocks:/var/www/html/wp-content/plugins/demo-blocks

  # One-off WP-CLI runner: docker compose run --rm cli wp <command>
  cli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./themes/gutenberg-blocks-demo:/var/www/html/wp-content/themes/gutenberg-blocks-demo
      - ./plugins/demo-blocks:/var/www/html/wp-content/plugins/demo-blocks
      - ./content:/content:ro

  # One-off Node runner for the block build: docker compose run --rm node npm run build
  node:
    image: node:20-bookworm-slim
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - ./plugins/demo-blocks:/app
      - ./themes/gutenberg-blocks-demo:/theme:ro

volumes:
  db_data:
  wp_core:
